[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "pyon-py"
version         = "0.1.0"
description     = "Python Frontend Framework on Pyodide & WebAssembly"
requires-python = ">=3.11"
keywords        = ["frontend", "webassembly", "pyodide", "reactive", "framework"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies    = ["aiohttp>=3.9", "watchfiles>=0.21", "click>=8.0", "tomlkit>=0.15", "typing_extensions>=4.7"]
readme          = "README.md"
authors         = [
    { name = "Raihan Najah", email = "rnajahazmy@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/ehanajah/pyon-py"
Repository = "https://github.com/ehanajah/pyon-py"

[project.scripts]
pyon = "pyon.cli.main:cli"
